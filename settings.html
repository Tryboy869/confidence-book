<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Confidence Book</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <script src="https://unpkg.com/i18next@23/dist/umd/i18next.min.js"></script>
  <script src="/translations.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/db-sync.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'DM Sans', sans-serif; box-sizing: border-box; }
    body { background: #0f0e17; color: #fffffe; min-height: 100vh; }
    .app-header { background: #1a182590; backdrop-filter: blur(12px); border-bottom: 1px solid #2d2a3e; position: sticky; top: 0; z-index: 30; }
    .card { background: #1a1825; border: 1px solid #2d2a3e; border-radius: 20px; padding: 20px; }
    .section-title { font-size: 0.72rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
    .option-btn { flex: 1; padding: 12px; border-radius: 12px; border: 2px solid #2d2a3e; background: transparent; color: #9ca3af; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover { border-color: #7c3aed50; color: #a78bfa; }
    .option-btn.active { border-color: #7c3aed; background: #7c3aed20; color: #a78bfa; }
    .avatar-btn { padding: 12px; border-radius: 12px; border: 2px solid #2d2a3e; background: transparent; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    .avatar-btn:hover { border-color: #7c3aed50; }
    .avatar-btn.active { border-color: #7c3aed; background: #7c3aed20; }
    .id-display { font-family: 'Courier New', monospace; font-size: 0.88rem; background: #0f0e17; border: 1px solid #2d2a3e; border-radius: 12px; padding: 14px 16px; color: #a78bfa; word-break: break-all; flex: 1; }
    .copy-btn { padding: 14px 16px; background: #7c3aed; color: white; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
    .copy-btn:hover { background: #6d28d9; }
    .copy-btn.copied { background: #10b981; }
    .btn-install { width: 100%; padding: 14px; border-radius: 12px; background: linear-gradient(135deg, #7c3aed, #a78bfa); color: white; font-weight: 700; border: none; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; }
    .btn-install:hover { opacity: 0.9; }
    .btn-logout { width: 100%; padding: 14px; border-radius: 12px; background: #7c3aed20; border: 1px solid #7c3aed30; color: #a78bfa; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-logout:hover { background: #7c3aed30; }
    .btn-danger { width: 100%; padding: 14px; border-radius: 12px; background: #ef444415; border: 1px solid #ef444430; color: #ef4444; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-danger:hover { background: #ef444425; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #10b981; color: white; font-weight: 600; font-size: 0.9rem; padding: 12px 24px; border-radius: 12px; opacity: 0; transition: all 0.3s; z-index: 100; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #3d3a4e; border-radius: 3px; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="max-w-xl mx-auto px-4 py-4 flex items-center gap-3">
      <button onclick="location.href='/feed.html'" class="p-2 rounded-xl hover:bg-purple-400/10 transition">
        <i data-lucide="arrow-left" class="w-5 h-5 text-purple-400"></i>
      </button>
      <span class="font-bold text-lg" data-i18n="settings.title">Settings</span>
    </div>
  </header>

  <div class="max-w-xl mx-auto px-4 py-6 space-y-4">

    <!-- Install PWA -->
    <div class="card" id="install-section" style="display:none">
      <p class="section-title" data-i18n="settings.install_title">Install the app</p>
      <p class="text-xs text-gray-500 mb-4" data-i18n="settings.install_desc">Add Confidence Book to your home screen for quick access</p>
      <button onclick="installPWA()" class="btn-install">
        <i data-lucide="download" class="w-5 h-5"></i>
        <span data-i18n="settings.install_btn">Install Confidence Book</span>
      </button>
    </div>

    <!-- Language -->
    <div class="card">
      <p class="section-title" data-i18n="settings.language">Language</p>
      <div class="flex gap-3">
        <button onclick="selectLanguage('en')" id="lang-en-btn" class="option-btn active">🇬🇧 English</button>
        <button onclick="selectLanguage('fr')" id="lang-fr-btn" class="option-btn">🇫🇷 Français</button>
      </div>
    </div>

    <!-- Avatar -->
    <div class="card">
      <p class="section-title" data-i18n="settings.avatar">Avatar</p>
      <p class="text-xs text-gray-500 mb-4" data-i18n="settings.avatar_desc">Your anonymous identity icon</p>
      <div class="grid grid-cols-4 gap-3">
        <button onclick="selectAvatar('moon')" class="avatar-btn" data-avatar="moon"><span class="text-2xl">🌙</span></button>
        <button onclick="selectAvatar('sun')" class="avatar-btn" data-avatar="sun"><span class="text-2xl">☀️</span></button>
        <button onclick="selectAvatar('leaf')" class="avatar-btn" data-avatar="leaf"><span class="text-2xl">🍃</span></button>
        <button onclick="selectAvatar('flower')" class="avatar-btn" data-avatar="flower"><span class="text-2xl">🌸</span></button>
        <button onclick="selectAvatar('butterfly')" class="avatar-btn" data-avatar="butterfly"><span class="text-2xl">🦋</span></button>
        <button onclick="selectAvatar('wave')" class="avatar-btn" data-avatar="wave"><span class="text-2xl">🌊</span></button>
        <button onclick="selectAvatar('sparkles')" class="avatar-btn" data-avatar="sparkles"><span class="text-2xl">✨</span></button>
        <button onclick="selectAvatar('star')" class="avatar-btn" data-avatar="star"><span class="text-2xl">⭐</span></button>
      </div>
    </div>

    <!-- My ID -->
    <div class="card">
      <p class="section-title" data-i18n="settings.my_id">My Anonymous ID</p>
      <p class="text-xs text-gray-500 mb-3" data-i18n="settings.my_id_help">Keep this safe — it's the only way to recover your account.</p>
      <div class="flex gap-2">
        <div class="id-display" id="user-id-display"></div>
        <button onclick="copyId()" id="copy-btn" class="copy-btn">
          <i data-lucide="copy" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Account -->
    <div class="card space-y-3">
      <p class="section-title" data-i18n="settings.account">Account</p>
      <button onclick="logout()" class="btn-logout">
        <i data-lucide="log-out" class="w-5 h-5"></i>
        <span data-i18n="settings.logout">Log out</span>
      </button>
      <button onclick="deleteAccount()" class="btn-danger">
        <i data-lucide="trash-2" class="w-5 h-5"></i>
        <span data-i18n="settings.delete">Delete my account</span>
      </button>
    </div>

    <p class="text-center text-xs text-gray-600 pb-4">Confidence Book · Anonymous forever</p>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const userId = localStorage.getItem('confidenceBookUserID');
    if (!userId) location.href = '/auth.html';

    document.getElementById('user-id-display').textContent = userId;

    // ── PWA Install ───────────────────────────────────────────────────────────
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-section').style.display = 'block';
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      document.getElementById('install-section').style.display = 'none';
    });

    async function installPWA() {
      if (!deferredPrompt) {
        showToast('App already installed or not available on this browser');
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') showToast('🎉 App installed!');
      deferredPrompt = null;
    }

    // Register SW
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    // ── Language ──────────────────────────────────────────────────────────────
    function selectLanguage(lang) {
      setLanguage(lang); // from translations.js — instant, no reload
      document.getElementById('lang-en-btn').classList.toggle('active', lang === 'en');
      document.getElementById('lang-fr-btn').classList.toggle('active', lang === 'fr');
      saveSettings();
      showToast(t('settings.saved'));
    }

    // Sync lang buttons with current language on load
    window.addEventListener('langchange', (e) => {
      const lang = e.detail.lang;
      document.getElementById('lang-en-btn').classList.toggle('active', lang === 'en');
      document.getElementById('lang-fr-btn').classList.toggle('active', lang === 'fr');
    });

    // ── Avatar ────────────────────────────────────────────────────────────────
    let currentAvatar = localStorage.getItem('confidenceBookAvatar') || 'moon';

    function selectAvatar(avatar) {
      currentAvatar = avatar;
      localStorage.setItem('confidenceBookAvatar', avatar);
      document.querySelectorAll('.avatar-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.avatar === avatar);
      });
      saveSettings();
      showToast(t('settings.saved'));
    }

    function applyAvatarUI() {
      document.querySelectorAll('.avatar-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.avatar === currentAvatar);
      });
    }

    // ── Lang buttons init ─────────────────────────────────────────────────────
    function initLangButtons() {
      const lang = getCurrentLanguage();
      document.getElementById('lang-en-btn').classList.toggle('active', lang === 'en');
      document.getElementById('lang-fr-btn').classList.toggle('active', lang === 'fr');
    }

    // ── Save to DB ────────────────────────────────────────────────────────────
    async function saveSettings() {
      try {
        await fetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-User-ID': userId },
          body: JSON.stringify({ theme: 'dark', avatar: currentAvatar, language: getCurrentLanguage() })
        });
      } catch (e) {}
    }

    // ── Load from DB ──────────────────────────────────────────────────────────
    async function loadSettings() {
      try {
        const res = await fetch('/api/profile', { headers: { 'X-User-ID': userId } });
        const data = await res.json();
        if (data.success && data.profile.settings) {
          const s = data.profile.settings;
          if (!localStorage.getItem('confidenceBookAvatar') && s.avatar) {
            currentAvatar = s.avatar;
            localStorage.setItem('confidenceBookAvatar', s.avatar);
          }
          // Language: localStorage always wins over DB
        }
      } catch (e) {}
      applyAvatarUI();
      initLangButtons();
    }

    // ── Copy ID ───────────────────────────────────────────────────────────────
    function copyId() {
      navigator.clipboard.writeText(userId).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.classList.add('copied');
        btn.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i>';
        lucide.createIcons();
        showToast(t('common.copied'));
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '<i data-lucide="copy" class="w-5 h-5"></i>';
          lucide.createIcons();
        }, 2000);
      });
    }

    // ── Account ───────────────────────────────────────────────────────────────
    async function logout() {
      await CB.clearAll().catch(() => {});
      localStorage.removeItem('confidenceBookUserID');
      location.href = '/welcome.html';
    }

    async function deleteAccount() {
      if (!confirm(t('settings.delete_confirm'))) return;
      try {
        await fetch('/api/account', { method: 'DELETE', headers: { 'X-User-ID': userId } });
        await CB.clearAll().catch(() => {});
        localStorage.clear();
        location.href = '/welcome.html';
      } catch { alert(t('common.error')); }
    }

    // ── Toast ─────────────────────────────────────────────────────────────────
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = `✓ ${msg}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    loadSettings();
    lucide.createIcons();
  </script>
</body>
</html>
